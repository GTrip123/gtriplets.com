<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>latest site news</title>

  <style>
    body {
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .commit {
      background: #1f2937;
      padding: 20px;
      margin: 15px auto;
      max-width: 700px;
      border-radius: 12px;
      transition: 0.2s;
    }

    .commit:hover {
      transform: translateY(-3px);
      background: #374151;
    }

    .commit h2 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .commit p {
      color: #cbd5e1;
    }

    a {
      color: #60a5fa;
    }

    #loading {
      text-align: center;
      margin: 30px;
      color: #9ca3af;
    }
    .stream-box {
  position: relative;
  width: 800px;
  height: 450px;
  max-width: 100%;
  background: #000;
  border-radius: 16px;
  overflow: hidden;
}

.stream-box iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

.resize-handle {
  position: absolute;
  right: 8px;
  bottom: 8px;
  width: 18px;
  height: 18px;
  cursor: nwse-resize;
  background: rgba(255, 255, 255, 0.85);
  clip-path: polygon(100% 0, 0 100%, 100% 100%);
  border-radius: 3px;
}

.resize-handle::after {
  content: "";
  position: absolute;
  right: 3px;
  bottom: 3px;
  width: 6px;
  height: 6px;
  border-right: 2px solid rgba(0, 0, 0, 0.5);
  border-bottom: 2px solid rgba(0, 0, 0, 0.5);
}
  </style>
</head>

<body>

<h1>latest site news</h1>

<div id="commits"></div>

<div id="loading">
  Loading... (if this is taking a while, my servers might be down)
</div>

<script>


let page = 1;
let loading = false;
let finished = false;


async function loadCommits() {

  if (loading || finished) return;

  loading = true;

  const response = await fetch("/api/updates?page=" + page);
  const commits = await response.json();



  if (commits.length === 0) {
    finished = true;
    document.getElementById("loading").innerHTML =
      "No more news.";
    return;
  }


  const container = document.getElementById("commits");


  commits.forEach(commit => {

    container.innerHTML += `
  <div class="commit">

    <h2>${commit.title}</h2>

    <p>${commit.description}</p>

    <p>
      ${commit.author}<br>
      ${new Date(commit.date).toLocaleString()}
    </p>

    <a href="${commit.url}" target="_blank">
      View →
    </a>

  </div>
`;

  });


  page++;
  loading = false;
  document.getElementById("loading").innerHTML =
    "Scroll for more...";
}



console.log("loadCommits called");
loadCommits();

</script>
  <div class="stream-box" id="streamBox">
  <iframe
    src="https://player.twitch.tv/?channel=gtripletsy&parent=gtriplets.com"
    allowfullscreen>
  </iframe>

  <div class="resize-handle" title="Drag to resize"></div>
</div>

<script>
  const box = document.getElementById("streamBox");
  const handle = box.querySelector(".resize-handle");

  let resizing = false;
  let startX = 0, startY = 0;
  let startW = 0, startH = 0;

  handle.addEventListener("pointerdown", (e) => {
    resizing = true;
    startX = e.clientX;
    startY = e.clientY;
    const rect = box.getBoundingClientRect();
    startW = rect.width;
    startH = rect.height;
    handle.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  handle.addEventListener("pointermove", (e) => {
    if (!resizing) return;

    const newW = Math.max(320, startW + (e.clientX - startX));
    const newH = Math.max(180, startH + (e.clientY - startY));

    box.style.width = newW + "px";
    box.style.height = newH + "px";
  });

  handle.addEventListener("pointerup", () => {
    resizing = false;
  });

  handle.addEventListener("pointercancel", () => {
    resizing = false;
  });
</script>

</body>
</html>
