<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gtrip's site</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

  body {
  background: linear-gradient(
    -45deg,
    #0f172a,
    #1e3a8a,
    #7c3aed,
    #0ea5e9
  );

  background-size: 400% 400%;
  animation: gradientMove 15s ease infinite;

  min-height: 100vh;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}


@keyframes gradientMove {
  0% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}
    .hero {
      max-width: 700px;
      padding: 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: white;
      color: #4f46e5;
      text-decoration: none;
      border-radius: 999px;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      background: #f3f4f6;
    }
  </style>
</head>

<body>
  <section class="hero">
    <h1>welcome to my website 👋</h1>

    <p>
      work in progress. this is just a simple home page 
       i code more.<br><br>
    </p>

    <a href="/updates" class="btn">see my latest updates to the site</a>
  </section>
</body>
</html>
